services:
  traefik:
    image: traefik:v3.7.1
    command:
      - --global.sendAnonymousUsage=false
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entryPoint.to=websecure
      - --entrypoints.web.http.redirections.entryPoint.scheme=https
      - --entrypoints.websecure.address=:443
      # Resolver DNS-01 (Cloudflare) para os domínios do Kalli
      - --certificatesresolvers.mytlschallenge.acme.dnschallenge=true
      - --certificatesresolvers.mytlschallenge.acme.dnschallenge.provider=cloudflare
      - --certificatesresolvers.mytlschallenge.acme.dnschallenge.resolvers=1.1.1.1:53,1.0.0.1:53
      - --certificatesresolvers.mytlschallenge.acme.email=${SSL_EMAIL}
      - --certificatesresolvers.mytlschallenge.acme.storage=/letsencrypt/acme.json
      - --certificatesresolvers.letsencrypt.acme.httpchallenge=true
      - --certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web
      - --certificatesresolvers.letsencrypt.acme.email=${SSL_EMAIL}
      - --certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme-http.json
      - --api.dashboard=true

    environment:
      - CF_DNS_API_TOKEN=${CF_DNS_API_TOKEN}
    labels:
      - traefik.enable=true
      - traefik.http.routers.traefik-dashboard.rule=Host(`traefik.${KALLI_DOMAIN}`)
      - traefik.http.routers.traefik-dashboard.entrypoints=websecure
      - traefik.http.routers.traefik-dashboard.tls=true
      - traefik.http.routers.traefik-dashboard.tls.certresolver=mytlschallenge
      - traefik.http.routers.traefik-dashboard.service=api@internal
      - traefik.http.routers.traefik-dashboard.middlewares=traefik-dashboard-auth
      - traefik.http.middlewares.traefik-dashboard-auth.basicauth.users=admin:$$apr1$$OZmZTH.u$$ch2kVt0rn01QLKz1s3awf/
    restart: always
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 512M
    networks:
      - default
      - geovision      
    ports:
      - 80:80
      - 443:443
    volumes:
      - traefik_data:/letsencrypt
      - /var/run/docker.sock:/var/run/docker.sock:ro
  beszel:
    image: henrygd/beszel:latest
    container_name: beszel-hub
    security_opt:
      - no-new-privileges:true
    labels:
      - traefik.enable=true
      - traefik.http.routers.beszel.rule=Host(`beszel.${KALLI_DOMAIN}`)
      - traefik.http.routers.beszel.tls=true
      - traefik.http.routers.beszel.entrypoints=web,websecure
      - traefik.http.routers.beszel.tls.certresolver=mytlschallenge
      - traefik.http.services.beszel.loadbalancer.server.port=8090
    healthcheck:
      test:
        - CMD
        - /beszel
        - health
        - --url
        - http://localhost:8090
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 256M
    restart: always
    volumes:
      - beszel_data:/beszel_data
  beszel-agent:
    image: henrygd/beszel-agent:latest
    container_name: beszel-agent
    network_mode: host
    security_opt:
      - no-new-privileges:true
    environment:
      - PORT=4567
      - KEY=ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIJ+IzFxwwvBN0je+0bvTqhD28FGhuQy2bvdhWKoW2hzy
      - TOKEN=5be9d04a-f44e-401e-ab5a-9dafbaaa7f9c
      - HUB_URL=https://beszel.kalliagendia.com.br
    deploy:
      resources:
        limits:
          memory: 128M
    restart: always
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/host:ro
  redis:
    image: redis/redis-stack-server:latest
    container_name: redis
    command:
      - redis-stack-server
      - --requirepass
      - ${REDIS_PASSWORD}
      - --appendonly
      - "yes"
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    restart: always
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 256M
    volumes:
      - redis_data:/data
  # ── Evolution API (migração do WAHA) — reaproveita postgres/redis já existentes ──
  evolution-api:
    image: evoapicloud/evolution-api:latest
    container_name: evolution-api
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    environment:
      - SERVER_URL=https://evolution.${KALLI_DOMAIN}
      - AUTHENTICATION_API_KEY=${EVOLUTION_API_KEY}
      - LANGUAGE=pt-BR
      - DATABASE_PROVIDER=postgresql
      - DATABASE_CONNECTION_URI=postgresql://evolution_app:${EVOLUTION_DB_PASSWORD}@postgres:5432/evolution?schema=evolution_api
      - DATABASE_SAVE_DATA_INSTANCE=true
      - DATABASE_SAVE_DATA_NEW_MESSAGE=true
      - DATABASE_SAVE_MESSAGE_UPDATE=true
      - DATABASE_SAVE_DATA_CONTACTS=true
      - DATABASE_SAVE_DATA_CHATS=true
      - CACHE_REDIS_ENABLED=true
      - CACHE_REDIS_URI=redis://:${REDIS_PASSWORD}@redis:6379/6
      - CACHE_REDIS_PREFIX_KEY=evolution
      - CACHE_LOCAL_ENABLED=false
      - WA_BUSINESS_TOKEN_WEBHOOK=${WA_BUSINESS_TOKEN}
      - WEBHOOK_GLOBAL_ENABLED=true
      - WEBHOOK_GLOBAL_URL=https://n8n.kalliagendia.com.br/webhook/evolution-connection
      - WEBHOOK_GLOBAL_WEBHOOK_BY_EVENTS=false
    labels:
      - traefik.enable=true
      - traefik.http.routers.evolution-api.rule=Host(`evolution.${KALLI_DOMAIN}`)
      - traefik.http.routers.evolution-api.tls=true
      - traefik.http.routers.evolution-api.entrypoints=web,websecure
      - traefik.http.routers.evolution-api.tls.certresolver=mytlschallenge
      - traefik.http.services.evolution-api.loadbalancer.server.port=8080
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 256M
    volumes:
      - evolution_instances:/evolution/instances
      - evolution_store:/evolution/store
  # ── Evolution Manager — dashboard visual da Evolution API, protegido por basicauth ──
  evolution-manager:
    image: evoapicloud/evolution-manager:latest
    container_name: evolution-manager
    restart: always
    depends_on:
      - evolution-api
    security_opt:
      - no-new-privileges:true
    # Bug conhecido da imagem (nginx.conf vem com uma diretiva Cache-Control inválida e
    # o nginx nem sobe — https://github.com/EvolutionAPI/evolution-api/issues/2093).
    # Workaround da comunidade: corrigir o nginx.conf antes de iniciar o nginx.
    entrypoint: /bin/sh
    command: -c "sed -i 's/ must-revalidate//g' /etc/nginx/conf.d/nginx.conf && nginx -g 'daemon off;'"
    labels:
      - traefik.enable=true
      - traefik.http.routers.evolution-manager.rule=Host(`evolution-manager.${KALLI_DOMAIN}`)
      - traefik.http.routers.evolution-manager.tls=true
      - traefik.http.routers.evolution-manager.entrypoints=web,websecure
      - traefik.http.routers.evolution-manager.tls.certresolver=mytlschallenge
      - traefik.http.services.evolution-manager.loadbalancer.server.port=80
      - traefik.http.middlewares.evolution-manager-auth.basicauth.users=${EVOLUTION_MANAGER_BASICAUTH}
      - traefik.http.routers.evolution-manager.middlewares=evolution-manager-auth
    deploy:
      resources:
        limits:
          memory: 256M
  postgres:
    image: pgvector/pgvector:pg16
    container_name: postgres-vdb
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    command: postgres  -c shared_buffers=1536MB  -c effective_cache_size=4608MB -c maintenance_work_mem=256MB -c work_mem=64MB -c max_connections=100
    restart: always
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 6G
        reservations:
          memory: 1G
    ports:
      - 127.0.0.1:5432:5432
    volumes:
      - postgres_data:/var/lib/postgresql/data
  n8n:
    image: docker.n8n.io/n8nio/n8n:2.41.6
    security_opt:
      - no-new-privileges:true
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    labels:
      - traefik.enable=true
      - traefik.http.routers.n8n.rule=Host(`n8n.${KALLI_DOMAIN}`)
      - traefik.http.routers.n8n.tls=true
      - traefik.http.routers.n8n.entrypoints=web,websecure
      - traefik.http.routers.n8n.tls.certresolver=mytlschallenge
      - traefik.http.middlewares.n8n.headers.SSLRedirect=true
      - traefik.http.middlewares.n8n.headers.STSSeconds=315360000
      - traefik.http.middlewares.n8n.headers.browserXSSFilter=true
      - traefik.http.middlewares.n8n.headers.contentTypeNosniff=true
      - traefik.http.middlewares.n8n.headers.forceSTSHeader=true
      - traefik.http.middlewares.n8n.headers.SSLHost=${KALLI_DOMAIN}
      - traefik.http.middlewares.n8n.headers.STSIncludeSubdomains=true
      - traefik.http.middlewares.n8n.headers.STSPreload=true
      - traefik.http.routers.n8n.middlewares=n8n@docker
      - traefik.http.routers.n8n-conexao.rule=Host(`conectar.symbionlab.com.br`) && (PathPrefix(`/webhook/conectar`) || PathPrefix(`/webhook/novo-link`))
      - traefik.http.routers.n8n-conexao.entrypoints=websecure
      - traefik.http.routers.n8n-conexao.tls=true
      - traefik.http.routers.n8n-conexao.tls.certresolver=mytlschallenge
    environment:
      - N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS=true
      - N8N_HOST=n8n.${KALLI_DOMAIN}
      - N8N_PORT=5678
      - N8N_PROTOCOL=https
      - N8N_RUNNERS_ENABLED=true
      - NODE_ENV=production
      - WEBHOOK_URL=https://n8n.${KALLI_DOMAIN}/
      - GENERIC_TIMEZONE=${GENERIC_TIMEZONE}
      - N8N_PROXY_HOPS=1
      - NODE_OPTIONS=--max-old-space-size=3072
    restart: always
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 512M
    ports:
      - 127.0.0.1:5678:5678
    volumes:
      - n8n_data:/home/node/.n8n
      - /local-files:/files
  kalli-landing:
    build:
      context: /opt/kalliagendia/kalli-landing
      args:
        NEXT_PUBLIC_APP_URL: https://app.${KALLI_DOMAIN}
    image: kalli-landing:${KALLI_TAG:-latest}
    container_name: kalli-landing
    security_opt:
      - no-new-privileges:true
    labels:
      - traefik.enable=true
      - traefik.http.routers.kalli-landing.rule=Host(`${KALLI_DOMAIN}`) || Host(`www.${KALLI_DOMAIN}`)
      - traefik.http.routers.kalli-landing.tls=true
      - traefik.http.routers.kalli-landing.entrypoints=web,websecure
      - traefik.http.routers.kalli-landing.tls.certresolver=mytlschallenge
      - traefik.http.services.kalli-landing.loadbalancer.server.port=3000
      - traefik.http.middlewares.kalli-landing-wwwredirect.redirectregex.regex=^https://www\.(.+)
      - traefik.http.middlewares.kalli-landing-wwwredirect.redirectregex.replacement=https://$${1}
      - traefik.http.middlewares.kalli-landing-wwwredirect.redirectregex.permanent=true
      - traefik.http.routers.kalli-landing.middlewares=kalli-landing-wwwredirect
    deploy:
      resources:
        limits:
          memory: 256M
    restart: always
  # ── Kalli — Backend público (app dos salões) ────────────────────────────────
  backend:
    build:
      context: /opt/kalliagendia/backend
    image: kalli-backend:${KALLI_TAG:-latest}
    container_name: kalli-backend
    env_file:
      - /opt/kalliagendia/backend/.env.production
    depends_on:
      postgres:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    labels:
      - traefik.enable=true
      - traefik.http.routers.kalli-backend.rule=Host(`api.${KALLI_DOMAIN}`)
      - traefik.http.routers.kalli-backend.tls=true
      - traefik.http.routers.kalli-backend.entrypoints=web,websecure
      - traefik.http.routers.kalli-backend.tls.certresolver=mytlschallenge
      - traefik.http.services.kalli-backend.loadbalancer.server.port=8000
    deploy:
      resources:
        limits:
          memory: 512M
    restart: always
    volumes:
      - kalli_uploads:/app/uploads
  # ── Kalli — Backend do painel admin (mesma imagem, entrypoint isolado) ───────
  backend-admin:
    image: kalli-backend:${KALLI_TAG:-latest}
    container_name: kalli-backend-admin
    command: ["uvicorn", "app.admin_main:app", "--host", "0.0.0.0", "--port", "8000"]
    env_file:
      - /opt/kalliagendia/backend/.env.production
    depends_on:
      backend:
        condition: service_started
      postgres:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    labels:
      - traefik.enable=true
      - traefik.http.routers.kalli-backend-admin.rule=Host(`admin-api.${KALLI_DOMAIN}`)
      - traefik.http.routers.kalli-backend-admin.tls=true
      - traefik.http.routers.kalli-backend-admin.entrypoints=web,websecure
      - traefik.http.routers.kalli-backend-admin.tls.certresolver=mytlschallenge
      - traefik.http.services.kalli-backend-admin.loadbalancer.server.port=8000
    deploy:
      resources:
        limits:
          memory: 384M
    restart: always
  # ── Kalli — App dos salões (Next.js) ────────────────────────────────────────
  kalli-agendia:
    build:
      context: /opt/kalliagendia/kalli-agendia
      args:
        NEXT_PUBLIC_API_URL: https://api.${KALLI_DOMAIN}/api/v1
        NEXT_PUBLIC_FORM_CLIENTE_URL: https://agendar.${KALLI_DOMAIN}
        NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${GOOGLE_LOGIN_CLIENT_ID}
    image: kalli-agendia:${KALLI_TAG:-latest}
    container_name: kalli-agendia
    security_opt:
      - no-new-privileges:true
    labels:
      - traefik.enable=true
      - traefik.http.routers.kalli-agendia.rule=Host(`app.${KALLI_DOMAIN}`)
      - traefik.http.routers.kalli-agendia.tls=true
      - traefik.http.routers.kalli-agendia.entrypoints=web,websecure
      - traefik.http.routers.kalli-agendia.tls.certresolver=mytlschallenge
      - traefik.http.services.kalli-agendia.loadbalancer.server.port=3000
    deploy:
      resources:
        limits:
          memory: 256M
    restart: always
  # ── Kalli — Painel super-admin (Next.js) ────────────────────────────────────
  kalli-super-admin:
    build:
      context: /opt/kalliagendia/kalli-super-admin
      args:
        NEXT_PUBLIC_API_URL: https://admin-api.${KALLI_DOMAIN}/api/v1
        NEXT_PUBLIC_SALAO_APP_URL: https://app.${KALLI_DOMAIN}
    image: kalli-super-admin:${KALLI_TAG:-latest}
    container_name: kalli-super-admin
    security_opt:
      - no-new-privileges:true
    labels:
      - traefik.enable=true
      - traefik.http.routers.kalli-super-admin.rule=Host(`admin.${KALLI_DOMAIN}`)
      - traefik.http.routers.kalli-super-admin.tls=true
      - traefik.http.routers.kalli-super-admin.entrypoints=web,websecure
      - traefik.http.routers.kalli-super-admin.tls.certresolver=mytlschallenge
      - traefik.http.services.kalli-super-admin.loadbalancer.server.port=3000
    deploy:
      resources:
        limits:
          memory: 256M
    restart: always
  kalli-form-cliente:
    build:
      context: /opt/kalliagendia/kalli-form-cliente
      args:
        NEXT_PUBLIC_API_URL: https://api.${KALLI_DOMAIN}/api/v1
    image: kalli-form-cliente:${KALLI_TAG:-latest}
    container_name: kalli-form-cliente
    security_opt:
      - no-new-privileges:true
    labels:
      - traefik.enable=true
      - traefik.http.routers.kalli-form-cliente.rule=Host(`agendar.${KALLI_DOMAIN}`)
      - traefik.http.routers.kalli-form-cliente.tls=true
      - traefik.http.routers.kalli-form-cliente.entrypoints=web,websecure
      - traefik.http.routers.kalli-form-cliente.tls.certresolver=mytlschallenge
      - traefik.http.services.kalli-form-cliente.loadbalancer.server.port=3000
    deploy:
      resources:
        limits:
          memory: 256M
    restart: always
  # ── SymbionLab — Landing Page / Site Estático ──────────────────────────────
  symbionlab:
    build:
      context: /opt/symbionlab
    image: symbionlab:${TAG_SYMBIONLAB:-latest}
    container_name: symbionlab
    security_opt:
      - no-new-privileges:true
    labels:
      - traefik.enable=true
      - traefik.http.routers.symbionlab.rule=Host(`symbionlab.com.br`) || Host(`www.symbionlab.com.br`)
      - traefik.http.routers.symbionlab.tls=true
      - traefik.http.routers.symbionlab.entrypoints=web,websecure
      - traefik.http.routers.symbionlab.tls.certresolver=mytlschallenge
      - traefik.http.services.symbionlab.loadbalancer.server.port=80
      - traefik.http.middlewares.symbionlab-wwwredirect.redirectregex.regex=^https://www\.(.+)
      - traefik.http.middlewares.symbionlab-wwwredirect.redirectregex.replacement=https://$${1}
      - traefik.http.middlewares.symbionlab-wwwredirect.redirectregex.permanent=true
      - traefik.http.routers.symbionlab.middlewares=symbionlab-wwwredirect
    deploy:
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 32M
    restart: always
  # ── SymbionLab — Backend de onboarding, roteamento e proxy da Cloud API ─────
  # Serve so /api/*. A landing, /onboarding/ e /admin/ sao estaticos, servidos
  # pelo nginx do servico symbionlab acima. Mesmo repositorio, contexto diferente.
  symbion-onboarding:
    build:
      context: /opt/symbionlab/backend
    image: symbion-onboarding:${TAG_SYMBION_ONBOARDING:-latest}
    container_name: symbion-onboarding
    env_file:
      - /opt/symbionlab/backend/.env.production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    labels:
      - traefik.enable=true
      - traefik.http.routers.symbion-onboarding.rule=Host(`symbionlab.com.br`) && PathPrefix(`/api`)
      # priority obrigatorio: o router symbionlab casa Host(`symbionlab.com.br`)
      # e engoliria /api sem isto. www ja e redirecionado para o apice.
      - traefik.http.routers.symbion-onboarding.priority=100
      - traefik.http.routers.symbion-onboarding.tls=true
      - traefik.http.routers.symbion-onboarding.entrypoints=web,websecure
      - traefik.http.routers.symbion-onboarding.tls.certresolver=mytlschallenge
      - traefik.http.services.symbion-onboarding.loadbalancer.server.port=8000
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M
    restart: always
# ── Auto-Docker — Gerenciador de containers e deploys ──────────────────────
  auto-docker:
    build:
      context: /opt/auto-docker
    image: auto-docker:${TAG_AUTODOCKER:-latest}
    container_name: auto-docker
    environment:
      - ROUTE_PREFIX=/autodocker
      - JWT_SECRET=${JWT_SECRET}
      - SSH_HOST=172.17.0.1
      - SSH_USER=deploy
      - SSH_KEY_PATH=/app/secrets/id_ed25519_kalli
      - COMPOSE_DIR=/docker/n8n
      - REPO_PATH=/opt/kalliagendia
      - DB_PATH=/app/data/deploys.db
    volumes:
      - /opt/auto-docker/secrets:/app/secrets:ro
      - /opt/auto-docker/data:/app/data
      - /opt/auto-docker/backups:/app/backups
    security_opt:
      - no-new-privileges:true
    labels:
      - traefik.enable=true
      - traefik.http.routers.autodocker.rule=Host(`symbionlab.com.br`) && PathPrefix(`/autodocker`)
      - traefik.http.routers.autodocker.priority=110
      - traefik.http.routers.autodocker.entrypoints=web,websecure
      - traefik.http.routers.autodocker.tls=true
      - traefik.http.routers.autodocker.tls.certresolver=mytlschallenge
      - traefik.http.services.autodocker.loadbalancer.server.port=8300
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 64M
    restart: always
  # ── Denise Portfolio — Site Acadêmico e Painel Administrativo ─────────────
  denise-portfolio:
    build:
      context: /opt/denise-portfolio
    image: denise-portfolio:${TAG_DENISE_PORTFOLIO:-latest}
    container_name: denise-portfolio
    env_file:
      - /opt/denise-portfolio/backend/.env.production
    depends_on:
      postgres:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    labels:
      - traefik.enable=true
      - traefik.http.routers.denise-portfolio.rule=Host(`deniseana.com.br`) || Host(`www.deniseana.com.br`)
      - traefik.http.routers.denise-portfolio.tls=true
      - traefik.http.routers.denise-portfolio.entrypoints=web,websecure
      - traefik.http.routers.denise-portfolio.tls.certresolver=mytlschallenge
      - traefik.http.services.denise-portfolio.loadbalancer.server.port=8000
      - traefik.http.middlewares.denise-portfolio-wwwredirect.redirectregex.regex=^https://www\.(.+)
      - traefik.http.middlewares.denise-portfolio-wwwredirect.redirectregex.replacement=https://$${1}
      - traefik.http.middlewares.denise-portfolio-wwwredirect.redirectregex.permanent=true

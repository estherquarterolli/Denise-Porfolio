<!doctype html>
<meta charset="utf-8">
<style>html,body,iframe{width:100%;height:100%;margin:0;border:0;display:block;overflow:hidden}</style>
<iframe id="preview" title="Prévia do site"></iframe>
<script>
  const preview = document.getElementById("preview");
  const sectionId = new URLSearchParams(location.search).get("section") || "sobre";
  preview.addEventListener("load", () => setTimeout(() => {
    const target = preview.contentDocument.getElementById(sectionId);
    if (target) preview.contentWindow.scrollTo({ top: target.getBoundingClientRect().top + preview.contentWindow.scrollY, behavior: "instant" });
  }, 1800), { once: true });
  preview.src = "/index.html";
</script>
